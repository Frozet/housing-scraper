name: Housing Scraper checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker compose run --build --rm --no-deps backend-test pytest -q -m 'not db'
  postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        schema: [empty, previous]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker compose up -d --wait db
      - run: docker compose exec -T db createdb -U avito avito_test
      - if: matrix.schema == 'previous'
        run: docker compose run --build --rm --no-deps backend-test alembic upgrade 013
      - run: docker compose run --build --rm --no-deps backend-test pytest -q -m db
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
  local-collector:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: |
          python -m pip install -r backend/requirements-browser.txt
          python -m playwright install-deps chromium
          xvfb-run -a python .github/scripts/check-local-collector.py
      - if: runner.os == 'Windows'
        run: python .github/scripts/check-local-collector.py
