name: Housing Scraper checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker compose run --build --rm --no-deps backend-test pytest -q -m 'not db'
  postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        schema: [empty, previous]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker compose up -d --wait db
      - run: docker compose exec -T db createdb -U avito avito_test
      - if: matrix.schema == 'previous'
        run: docker compose run --build --rm --no-deps backend-test alembic upgrade 013
      - run: docker compose run --build --rm --no-deps backend-test pytest -q -m db
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
